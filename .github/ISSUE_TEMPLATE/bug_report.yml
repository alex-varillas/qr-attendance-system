name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not include real employee or business data.
        For a security problem, do not use an issue: see the security policy.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release, or the commit you installed.
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - Docker Compose
        - Without Docker
        - Development setup
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove anything private first.
      render: text
